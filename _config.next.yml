# ==================== 主题样式（Gemini） ====================
scheme: Gemini

# ==================== 深色模式 ====================
darkmode: false

# ==================== 网站图标 & 头像 ====================
favicon:
  small: /images/logo.svg
  medium: /images/logo.svg
  apple_touch_icon: /images/logo.svg

avatar:
  url: /images/avatar.gif
  rounded: false
  rotated: false

# ==================== 菜单 ====================
menu:
  home: / || fa fa-home
  archives: /archives/ || fa fa-archive

# ==================== 侧边栏 ====================
sidebar:
  position: left
  display: post

# ==================== 社交链接 ====================
social:
  GitHub: https://github.com/nisoke || fab fa-github
  E-Mail: mailto:nisokesun@gmail.com || fa fa-envelope

# ==================== 目录 (TOC) ====================
toc:
  enable: true
  number: true
  expand_all: false
  max_depth: 6

# ==================== 数学公式（由 body-end.njk 引入 MathJax） ====================
math:
  every_page: false
  mathjax:
    enable: false
  katex:
    enable: false

# ==================== 页脚 ====================
footer:
  since: 2026
  powered: true

# ==================== 自定义文件（样式 & 数学公式） ====================
custom_file_path:
  head: source/_data/head.njk
  bodyEnd: source/_data/body-end.njk
