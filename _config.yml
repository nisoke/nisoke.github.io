# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog.


title: Changxu's blog
description: A quiet place for notes, thoughts, and occasional feelings.
github_username: nisoke


remote_theme: cotes2020/jekyll-theme-chirpy

# 构建相关
plugins:
  - jekyll-remote-theme

# 你的社交账号（可选）
social:
  name: nisoke           # 你的名字
  email: nisokesun@gmail.com
  github: nisoke         # 你的GitHub用户名

# 网站链接
url: "https://nisoke.github.io"  # 你的博客地址
baseurl: ""  # 如果你的博客不在子路径，就保持为空

# Set this to true to get LaTeX math equation support
use_math: true

# Add your Google Analytics ID here if you have one and want to use it
google_analytics:

# Everything below here can be ignored, unless you want to change the theme entirely
theme: minima
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-octicons
  - jekyll-github-metadata

titles_from_headings:
  enabled:     true
  strip_title: true
  collections: true

highlighter: rouge
markdown: kramdown
kramdown:
  math_engine: katex
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge
