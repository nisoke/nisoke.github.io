# ==================== 站点 ====================
title: Sunrise Realm
subtitle: ""
description: ""
keywords:
author: 旭
language: zh-CN
timezone: "Asia/Shanghai"

# ==================== URL ====================
url: https://nisoke.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# ==================== 目录 ====================
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# ==================== 写作 ====================
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# ==================== 首页 ====================
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# ==================== 分类与标签 ====================
default_category: uncategorized
category_map:
tag_map:

# ==================== 日期格式 ====================
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# ==================== 分页 ====================
per_page: 10
pagination_dir: page

# ==================== 主题 ====================
theme: next

# ==================== 部署 ====================
deploy:
  type: ''
